name: Sync LeetCode submissions
on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "17 */3 * * *"    # every 3 hours
permissions:
  contents: write
concurrency: leetcode-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull accepted submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python3 scripts/leetcode_sync.py
      - name: Commit
        run: |
          git config user.name "leetcode-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leetcode
          git diff --cached --quiet || (git commit -m "LeetCode sync: $(date -u +'%Y-%m-%d %H:%M')" && git push)
